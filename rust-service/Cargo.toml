[package]
name = "rust-service"
version = "1.0.0"
edition = "2021"
description = "Simple REST API service in Rust (axum) for the Rust vs Node benchmark."
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
